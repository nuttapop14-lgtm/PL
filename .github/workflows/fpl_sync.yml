name: Auto Sync FPL Scores to Firebase

on:
  schedule:
    # Run every 4 hours automatically (00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC)
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual 1-click trigger button on GitHub & Mobile App

permissions:
  contents: write

jobs:
  sync-fpl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run FPL Sync Engine
        run: node sync_fpl.js

      - name: Commit and push updated data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fpl_data.json index.html pl.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update FPL scores [skip ci]" && git push)
